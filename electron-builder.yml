appId: com.torrentdeck.app
productName: TorrentDeck
# Compiles + bundles the macOS set-default-torrent helper (build/mac/*.swift)
# so the app can offer to become the default .torrent handler on first launch.
afterPack: build/afterPack.cjs
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
extraResources:
  # Offline GeoIP database for peer country flags (read at runtime by maxmind).
  - from: build/geoip
    to: geoip
protocols:
  - name: Magnet link
    schemes:
      - magnet
fileAssociations:
  - ext: torrent
    name: BitTorrent metainfo
    mimeType: application/x-bittorrent
    role: Viewer
mac:
  category: public.app-category.utilities
  hardenedRuntime: true
  gatekeeperAssess: false
  # Hardened-runtime entitlements Electron needs, or the notarized app crashes on launch.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing/notarization pick up CSC_LINK / CSC_KEY_PASSWORD and
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID from the environment.
  notarize: true
  # Apple Silicon only — Intel (x64) macOS support was dropped.
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
linux:
  category: Network
  target:
    - AppImage
    - deb
  # Static-runtime AppImage toolset (AppImage type2-runtime 20251108). The
  # default "0.0.0" legacy runtime needs libfuse2 on the host, which Ubuntu
  # 22.04+/Fedora no longer ship, so the AppImage would fail to launch there.
  desktop:
    entry:
      MimeType: x-scheme-handler/magnet;application/x-bittorrent;
nsis:
  oneClick: true
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: pramodbutte
  repo: torrentdeck
# See the `linux:` comment above — static (no libfuse2) AppImage runtime.
toolsets:
  appimage: "1.0.3"
# Embeds AppImageUpdate update info in the AppImage and publishes the .zsync
# next to it (build/appimageUpdateInfo.cjs). No-ops for mac/win artifacts.
artifactBuildCompleted: build/appimageUpdateInfo.cjs
afterAllArtifactBuild: build/appimageUpdateInfo.cjs
