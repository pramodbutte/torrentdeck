name: Release (Linux)

# macOS and Windows are built and published locally (they sign with the
# developer's keychain / are unsigned NSIS) — see the `release:mac` / `release:win`
# npm scripts. Linux AppImage + deb need a Linux host, so CI builds and publishes
# them to the same GitHub release for the tag. Runs on `v*` tags, or manually.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the GitHub release (off = build only; artifacts attached to the run)'
        type: boolean
        default: true

# electron-builder needs to create/upload the GitHub release with GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # zsyncmake is used by build/appimageUpdateInfo.cjs to publish the
      # AppImageUpdate .zsync file next to the AppImage.
      - run: sudo apt-get update && sudo apt-get install -y zsync

      - run: npm run typecheck

      - run: npm test

      # Manual runs can untick `publish` to dry-run the build (toolset download,
      # AppImage update-info hook, zsyncmake) without touching any release.
      - name: Build and publish (Linux)
        run: npx electron-vite build && npx electron-builder --linux --publish ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && 'never' || 'always' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (dry run only)
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/*.deb
          if-no-files-found: error
